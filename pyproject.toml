[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "portable-support-agent"
version = "0.1.0"
description = "Intentionally SQL-injectable customer-support simulation agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langchain-anthropic>=1,<2",
  "langchain-aws>=1,<2",
  "boto3>=1.40,<2",
  "botocore>=1.40,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<0.5",
  "openai>=2,<4",
  "numpy>=2,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.13,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL/pgvector database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
